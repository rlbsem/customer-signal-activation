name: Regenerate customer signal diagram (temporary)
on:
  push:
    branches: [visual/groundbreakers-portfolio-theme]
    paths:
      - README.md
      - scripts/render_diagram.py
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - name: Install pinned Mermaid browser bundle
        shell: bash
        run: npm install --no-save --no-package-lock --no-audit --no-fund mermaid@10.9.3
      - name: Render README source using browser and record new hashes
        run: python scripts/render_diagram.py --mermaid-js node_modules/mermaid/dist/mermaid.min.js
      - name: Save SVG and evidence manifest on visual branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/architecture.svg docs/evidence/diagram-check.json
          if ! git diff --cached --quiet; then
            git commit -m "Render Groundbreakers customer signal architecture SVG"
            git push origin HEAD:visual/groundbreakers-portfolio-theme
          fi
