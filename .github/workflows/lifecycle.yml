name: Verify lifecycle orchestration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install --with-deps chromium
      - run: python -c "from pathlib import Path; Path('work').mkdir(exist_ok=True)"
      - run: python -m pytest tests/test_lifecycle.py -q --basetemp work/lifecycle-ci-tests
      - run: python scripts/verify_lifecycle.py work/lifecycle-ci-demo work/lifecycle-ci-evidence
      - run: python scripts/check_lifecycle.py
